<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturador OLICAHE</title>
<meta name="theme-color" content="#1B2B35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facturador">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#ECEAE3;
    --card:#FFFFFF;
    --ink:#1B2B35;
    --ink-soft:#5B6B73;
    --line:#D7D3C7;
    --amber:#E2A23B;
    --amber-dark:#B87F22;
    --blue:#345C74;
    --danger:#B3452C;
    --danger-soft:#F3E3DD;
    --ok:#4C7A5C;
    --font-display:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}

  /* ---------- Header con regla técnica ---------- */
  .app-header{background:var(--ink);color:#fff;padding:18px 24px 0;}
  .app-header h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 2px;letter-spacing:.3px;}
  .app-header p{margin:0 0 14px;font-size:12.5px;color:#B9C4C9;font-family:var(--font-mono);}

  /* ---------- Interruptor Factura / Presupuesto ---------- */
  .doctype-toggle{display:flex;max-width:1280px;margin:14px auto 0;padding:0 20px;gap:8px;}
  .doctype-toggle button{flex:1;padding:11px;border-radius:7px;border:1.5px solid var(--ink);background:var(--card);font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;}
  .doctype-toggle button.active{background:var(--ink);color:#fff;}
  .doctype-toggle button.active.is-presupuesto{background:var(--blue);border-color:var(--blue);}
  @media (max-width:920px){ .doctype-toggle{padding:0 12px;} }
  .ruler{height:14px;background:repeating-linear-gradient(90deg,var(--amber) 0 1px,transparent 1px 24px);opacity:.85;}

  .layout{max-width:1280px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:920px){
    .layout{grid-template-columns:1fr;padding:14px 12px 50px;}
    .tabs{display:flex;gap:8px;margin-bottom:14px;}
    .tabs button{flex:1;}
    .panel-hidden{display:none !important;}
  }
  .tabs{display:none;}
  @media (max-width:920px){ .tabs{display:flex;} }
  .tabs button{padding:10px;border:1px solid var(--line);background:var(--card);font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-soft);border-radius:6px;cursor:pointer;}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}

  /* ---------- Cards de formulario ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .card h2{font-family:var(--font-display);font-size:15px;font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--amber);color:var(--ink);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field-row.thirds{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field.full{grid-column:1/-1;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:600;}
  input,textarea{font-family:var(--font-body);font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:#FDFCFA;color:var(--ink);width:100%;}
  input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
  input[type=number]{font-family:var(--font-mono);}
  textarea{resize:vertical;min-height:38px;}

  .logo-row{display:flex;align-items:center;gap:12px;margin-top:4px;}
  .logo-preview{width:64px;height:64px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FAFAF7;flex-shrink:0;}
  .logo-preview img{max-width:100%;max-height:100%;object-fit:contain;}
  .logo-preview span{font-size:9px;color:var(--ink-soft);text-align:center;padding:4px;}
  .file-btn{display:inline-block;padding:8px 12px;border:1px solid var(--ink);border-radius:5px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;}
  .file-btn input{display:none;}

  button.btn{font-family:var(--font-body);font-weight:700;font-size:13px;padding:9px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  button.btn.secondary{background:#fff;color:var(--ink);}
  button.btn.amber{background:var(--amber);border-color:var(--amber-dark);color:#3a2a05;}
  button.btn.danger-outline{background:#fff;border-color:var(--danger);color:var(--danger);padding:5px 9px;font-size:12px;}
  button.btn.small{padding:6px 10px;font-size:12px;}
  button.btn:hover{filter:brightness(0.95);}
  button.btn:disabled{opacity:.5;cursor:not-allowed;}

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}

  /* ---------- Obras / lineas ---------- */
  .obra-block{border:1px solid var(--line);border-radius:7px;margin-bottom:12px;overflow:hidden;}
  .obra-head{background:#F5F3EC;padding:8px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);}
  .obra-head input{font-weight:700;font-family:var(--font-display);font-size:14.5px;border:none;background:transparent;padding:4px 2px;}
  .obra-head input:focus{outline:none;border-bottom:1px solid var(--blue);}
  .obra-body{padding:10px;}
  .linea-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .linea-row:last-of-type{border-bottom:none;}
  .lf{display:flex;flex-direction:column;gap:2px;}
  .lf label{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);font-weight:600;}
  .lf input, .lf select{font-size:13px;padding:7px 7px;border:1px solid var(--line);border-radius:5px;background:#FDFCFA;color:var(--ink);font-family:var(--font-body);}
  .lf-desc{flex:1 1 170px;}
  .lf-unit{flex:0 0 84px;}
  .lf-qty{flex:0 0 66px;}
  .lf-rate{flex:0 0 78px;}
  .lf-total{flex:0 0 84px;}
  .lf-total .linea-total{font-family:var(--font-mono);font-size:13px;color:var(--ink);text-align:right;padding:7px 2px;}
  .lf-remove{flex:0 0 24px;}
  .linea-total{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);text-align:right;}
  .linea-remove{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;line-height:1;padding:6px;}
  .linea-remove:hover{color:#7c2f1c;}
  .obra-remove{margin-left:auto;background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;font-weight:600;}

  /* ---------- Historial ---------- */
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-main{cursor:pointer;flex:1;min-width:0;}
  .hist-main b{font-family:var(--font-mono);}
  .hist-sub{color:var(--ink-soft);font-size:11.5px;}
  .hist-empty{color:var(--ink-soft);font-size:12.5px;font-style:italic;}

  /* ---------- Vista previa (título block estilo plano) ---------- */
  .preview-wrap{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;position:sticky;top:14px;align-self:start;}
  .preview-toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F5F3EC;border-bottom:1px solid var(--line);}
  .preview-toolbar span{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:700;}
  #invoice-sheet{padding:28px 26px;font-family:var(--font-body);color:var(--ink);}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:16px;gap:14px;}
  .sheet-logo img{max-width:130px;max-height:70px;object-fit:contain;}
  .sheet-logo-placeholder{width:100px;height:56px;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink-soft);text-align:center;}
  .sheet-company{text-align:right;font-size:11.5px;line-height:1.5;color:var(--ink-soft);}
  .sheet-company b{color:var(--ink);font-size:14px;font-family:var(--font-display);}
  .sheet-title-block{display:flex;justify-content:space-between;margin-bottom:18px;gap:14px;}
  .sheet-title{font-family:var(--font-display);font-size:26px;letter-spacing:1px;margin:0;}
  .sheet-title-block .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);text-align:right;line-height:1.7;}
  .sheet-title-block .meta b{color:var(--ink);}
  .sheet-client{background:#F5F3EC;border-left:3px solid var(--amber);padding:8px 12px;margin-bottom:18px;font-size:12.5px;line-height:1.6;}
  .sheet-client .lbl{font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.4px;display:block;margin-bottom:2px;}
  table.sheet-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px;}
  table.sheet-table thead th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:6px 4px;}
  table.sheet-table td{padding:6px 4px;border-bottom:1px solid var(--line);}
  table.sheet-table tr.obra-title-row td{background:#F5F3EC;font-weight:700;font-family:var(--font-display);padding-top:9px;padding-bottom:5px;}
  .num{text-align:right;font-family:var(--font-mono);white-space:nowrap;}
  .sheet-totals{margin-top:12px;margin-left:auto;width:230px;font-size:13px;}
  .sheet-totals div{display:flex;justify-content:space-between;padding:4px 0;}
  .sheet-totals .total{border-top:2px solid var(--ink);margin-top:4px;padding-top:8px;font-weight:700;font-size:16px;font-family:var(--font-mono);}
  .sheet-footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .empty-note{font-size:12px;color:var(--ink-soft);font-style:italic;padding:8px 0;}
  .sheet-conditions{margin-top:14px;padding:10px 12px;background:#F5F3EC;border-left:3px solid var(--blue);font-size:10.5px;color:var(--ink-soft);line-height:1.5;white-space:pre-wrap;}
  .sheet-conditions b{color:var(--ink);}
</style>
</head>
<body>

<div class="app-header">
  <h1>Facturador de Obras</h1>
  <p>logo · datos de empresa · líneas por obra → PDF listo para el cliente</p>
</div>
<div class="ruler"></div>

<div class="doctype-toggle">
  <button id="typeFacturaBtn" class="active" data-type="factura" type="button">Factura</button>
  <button id="typePresupuestoBtn" data-type="presupuesto" type="button">Presupuesto</button>
</div>

<div class="layout">
  <div class="tabs">
    <button id="tabForm" class="active">Datos</button>
    <button id="tabPreview">Vista previa</button>
  </div>

  <!-- ===================== COLUMNA FORMULARIO ===================== -->
  <div class="col" id="colForm">

    <div class="card" id="companyCard">
      <h2>Tu empresa</h2>
      <div class="logo-row">
        <div class="logo-preview" id="logoPreview"><span>Sin logo</span></div>
        <label class="file-btn">Subir logo
          <input type="file" id="logoInput" accept="image/*">
        </label>
        <button class="btn small secondary" id="clearLogoBtn" type="button">Quitar</button>
      </div>
      <div class="field-row" style="margin-top:12px;">
        <div class="field"><label>Nombre / razón social</label><input data-f="name" id="c_name" placeholder="Construcciones Ejemplo S.L."></div>
        <div class="field"><label>NIF / CIF</label><input data-f="taxId" id="c_taxId" placeholder="B12345678"></div>
      </div>
      <div class="field-row">
        <div class="field full"><label>Dirección</label><input data-f="address" id="c_address" placeholder="Calle Mayor 12, 28001 Madrid"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Teléfono</label><input data-f="phone" id="c_phone"></div>
        <div class="field"><label>Email</label><input data-f="email" id="c_email"></div>
      </div>
      <div class="field-row">
        <div class="field full"><label>IBAN para el pago (opcional)</label><input data-f="iban" id="c_iban" placeholder="ES00 0000 0000 0000 0000 0000"></div>
      </div>
      <div class="btn-row">
        <button class="btn secondary" id="saveCompanyBtn" type="button">Guardar datos de empresa</button>
      </div>
    </div>

    <div class="card" id="clientCard">
      <h2>Cliente</h2>
      <div class="field-row" id="clientFields">
        <div class="field"><label>Nombre / razón social</label><input data-f="name" id="cl_name"></div>
        <div class="field"><label>NIF / CIF</label><input data-f="taxId" id="cl_taxId"></div>
      </div>
      <div class="field-row">
        <div class="field full"><label>Dirección</label><input data-f="address" id="cl_address"></div>
      </div>
      <div class="field-row">
        <div class="field full"><label>Email</label><input data-f="email" id="cl_email"></div>
      </div>
    </div>

    <div class="card" id="invoiceCard">
      <h2 id="invoiceCardTitle">Datos de la factura</h2>
      <div class="field-row thirds" id="invoiceFields">
        <div class="field"><label id="inv_number_label">Nº de factura</label><input data-f="number" id="inv_number"></div>
        <div class="field"><label>Fecha</label><input type="date" data-f="date" id="inv_date"></div>
        <div class="field"><label>Impuesto (%)</label><input type="number" step="0.1" data-f="taxPercent" id="inv_tax"></div>
      </div>
      <div class="field-row" id="presupuestoExtra" style="display:none;">
        <div class="field"><label>Válido durante (días)</label><input type="number" step="1" min="0" data-f="validDays" id="inv_validDays"></div>
        <div class="field full"><label>Condiciones / notas de aceptación</label><textarea data-f="conditions" id="inv_conditions" rows="2"></textarea></div>
      </div>
    </div>

    <div class="card">
      <h2>Obras / conceptos</h2>
      <div id="obrasContainer"></div>
      <div class="btn-row">
        <button class="btn amber" id="addObraBtn" type="button">+ Añadir obra</button>
      </div>
    </div>

    <div class="card">
      <h2 id="historyCardTitle">Facturas guardadas</h2>
      <div id="historyList"><p class="hist-empty">Aún no hay facturas guardadas.</p></div>
    </div>
  </div>

  <!-- ===================== COLUMNA VISTA PREVIA ===================== -->
  <div class="col panel-hidden" id="colPreview">
    <div class="preview-wrap">
      <div class="preview-toolbar">
        <span>Vista previa</span>
        <div class="btn-row" style="margin:0;">
          <button class="btn secondary small" id="newInvoiceBtn" type="button">Nueva factura</button>
          <button class="btn secondary small" id="saveInvoiceBtn" type="button">Guardar factura</button>
          <button class="btn amber" id="generateBtn" type="button">Generar PDF</button>
        </div>
      </div>
      <div id="invoice-sheet"></div>
    </div>
  </div>
</div>

  var state = {
    company:{ name:"", taxId:"", address:"", phone:"", email:"", iban:"", logoDataUrl: DEFAULT_LOGO, logoW:977, logoH:882 },
    client:{ name:"", taxId:"", address:"", email:"" },
    invoice:{ type:"factura", number:"", date: new Date().toISOString().slice(0,10), taxPercent:21, validDays:30, conditions:"Presupuesto sin compromiso. Precios sujetos a revisión si varían las condiciones de la obra." },
    obras:[]
  };

  function newLinea(){ return { id: uid(), desc:"", unit:"horas", qty:"", rate:"" }; }
  function newObra(title){ return { id: uid(), title: title || "Obra sin título", lineas:[ newLinea() ] }; }
  function unitAbbr(u){ return u === 'm2' ? 'm²' : 'h'; }
  function unitRateLabel(u){ return u === 'm2' ? '€ / m²' : '€ / hora'; }
  function unitQtyLabel(u){ return u === 'm2' ? 'm²' : 'Horas'; }

  state.obras.push(newObra("Obra 1"));

  /* ---------------- utilidades ---------------- */
  function fmt(n){
    if(isNaN(n)) n = 0;
    return n.toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function addDays(dateStr, days){
    if(!dateStr) return '';
    var d = new Date(dateStr+'T00:00:00');
    if(isNaN(d.getTime())) return '';
    d.setDate(d.getDate() + (parseInt(days,10)||0));
    return d.toISOString().slice(0,10);
  }

  function obraSubtotal(obra){
    return obra.lineas.reduce(function(acc,l){ return acc + num(l.qty)*num(l.rate); }, 0);
  }
  function calcTotals(){
    var subtotal = state.obras.reduce(function(acc,o){ return acc + obraSubtotal(o); }, 0);
    var taxAmount = subtotal * (num(state.invoice.taxPercent)/100);
    return { subtotal: subtotal, taxAmount: taxAmount, total: subtotal + taxAmount };
  }

  function docPrefix(){ return state.invoice.type === 'presupuesto' ? 'P' : 'F'; }
  function suggestNextNumber(counter){
    var year = new Date().getFullYear();
    var seq = String(counter).padStart(3,'0');
    return docPrefix() + "-" + year + "-" + seq;
  }
  function parseSeqFromNumber(number){
    var m = new RegExp('^'+docPrefix()+'-(\\d{4})-(\\d+)$').exec(String(number||''));
    if(!m) return null;
    if(parseInt(m[1],10) !== new Date().getFullYear()) return null;
    return parseInt(m[2],10);
  }

  function saveToHistory(){
    var totals = calcTotals();
    var snapshot = { client: state.client, invoice: state.invoice, obras: state.obras, uidCounter: uidCounter, total: totals.total, date: state.invoice.date, number: state.invoice.number };
    saveInvoiceSnapshot(state.invoice.number, snapshot);
    return getIndex().then(function(idx){
      idx = idx.filter(function(i){ return i.number !== state.invoice.number; });
      idx.unshift({ number: state.invoice.number, client: state.client.name, total: totals.total, date: state.invoice.date });
      idx = idx.slice(0,50);
      saveIndex(idx);
      renderHistory(idx);
      return getCounter();
    }).then(function(c){
      var parsed = parseSeqFromNumber(state.invoice.number);
      var next = parsed !== null ? Math.max(c, parsed+1) : c+1;
      setCounter(next);
    });
  }

  /* ---------------- storage (localStorage del navegador, persistente en el móvil) ---------------- */
  var LS_PREFIX = 'facturadorOlicahe:';
  var storageOk = (function(){
    try{
      var testKey = LS_PREFIX + '__test__';
      window.localStorage.setItem(testKey, '1');
      window.localStorage.removeItem(testKey);
      return true;
    }catch(err){ return false; }
  })();

  function lsGet(key){
    try{ return window.localStorage.getItem(LS_PREFIX + key); }catch(err){ return null; }
  }
  function lsSet(key, value){
    try{ window.localStorage.setItem(LS_PREFIX + key, value); }catch(err){}
  }
  function lsRemove(key){
    try{ window.localStorage.removeItem(LS_PREFIX + key); }catch(err){}
  }

  function counterKey(){ return state.invoice.type === 'presupuesto' ? 'budget-counter' : 'invoice-counter'; }
  function indexKey(){ return state.invoice.type === 'presupuesto' ? 'budgets-index' : 'invoices-index'; }
  function snapshotKeyPrefix(){ return state.invoice.type === 'presupuesto' ? 'budget:' : 'invoice:'; }

  function saveCompanyProfile(){
    lsSet('company-profile', JSON.stringify(state.company));
  }
  function loadCompanyProfile(){
    var raw = lsGet('company-profile');
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  }
  function getCounter(){
    var raw = lsGet(counterKey());
    return Promise.resolve(raw ? parseInt(raw,10) : 1);
  }
  function setCounter(n){
    lsSet(counterKey(), String(n));
  }
  function getIndex(){
    var raw = lsGet(indexKey());
    return Promise.resolve(raw ? JSON.parse(raw) : []);
  }
  function saveIndex(idx){
    lsSet(indexKey(), JSON.stringify(idx));
  }
  function saveInvoiceSnapshot(number, snapshot){
    lsSet(snapshotKeyPrefix()+number, JSON.stringify(snapshot));
  }
  function loadInvoiceSnapshot(number){
    var raw = lsGet(snapshotKeyPrefix()+number);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  }
  function deleteInvoiceSnapshot(number){
    lsRemove(snapshotKeyPrefix()+number);
  }


  /* ---------------- render: formulario de empresa/cliente/factura ---------------- */
  function fillStaticInputs(){
    document.getElementById('c_name').value = state.company.name;
    document.getElementById('c_taxId').value = state.company.taxId;
    document.getElementById('c_address').value = state.company.address;
    document.getElementById('c_phone').value = state.company.phone;
    document.getElementById('c_email').value = state.company.email;
    document.getElementById('c_iban').value = state.company.iban;

    document.getElementById('cl_name').value = state.client.name;
    document.getElementById('cl_taxId').value = state.client.taxId;
    document.getElementById('cl_address').value = state.client.address;
    document.getElementById('cl_email').value = state.client.email;

    document.getElementById('inv_number').value = state.invoice.number;
    document.getElementById('inv_date').value = state.invoice.date;
    document.getElementById('inv_tax').value = state.invoice.taxPercent;
    document.getElementById('inv_validDays').value = state.invoice.validDays;
    document.getElementById('inv_conditions').value = state.invoice.conditions;

    applyDocTypeUI();
    renderLogoPreview();

  function applyDocTypeUI(){
    var isPresupuesto = state.invoice.type === 'presupuesto';
    document.getElementById('typeFacturaBtn').classList.toggle('active', !isPresupuesto);
    document.getElementById('typePresupuestoBtn').classList.toggle('active', isPresupuesto);
    document.getElementById('typePresupuestoBtn').classList.toggle('is-presupuesto', isPresupuesto);
    document.getElementById('invoiceCardTitle').textContent = isPresupuesto ? 'Datos del presupuesto' : 'Datos de la factura';
    document.getElementById('inv_number_label').textContent = isPresupuesto ? 'Nº de presupuesto' : 'Nº de factura';
    document.getElementById('historyCardTitle').textContent = isPresupuesto ? 'Presupuestos guardados' : 'Facturas guardadas';
    document.getElementById('presupuestoExtra').style.display = isPresupuesto ? '' : 'none';
    document.getElementById('newInvoiceBtn').textContent = isPresupuesto ? 'Nuevo presupuesto' : 'Nueva factura';
    document.getElementById('saveInvoiceBtn').textContent = isPresupuesto ? 'Guardar presupuesto' : 'Guardar factura';
  }

  function renderLogoPreview(){
    var el = document.getElementById('logoPreview');
    if(state.company.logoDataUrl){
      el.innerHTML = '<img src="'+state.company.logoDataUrl+'" alt="logo">';

  function switchDocType(newType){
    if(state.invoice.type === newType) return;
    state.invoice.type = newType;
    getCounter().then(function(counter){
      state.invoice.number = suggestNextNumber(counter);
      fillStaticInputs();
      renderPreview();
      return getIndex();
    }).then(function(idx){ renderHistory(idx); });
  }
  document.getElementById('typeFacturaBtn').addEventListener('click', function(){ switchDocType('factura'); });
  document.getElementById('typePresupuestoBtn').addEventListener('click', function(){ switchDocType('presupuesto'); });

  document.getElementById('logoInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var dataUrl = ev.target.result;
      var img = new Image();
      img.onload = function(){
        state.company.logoDataUrl = dataUrl;
        state.company.logoW = img.naturalWidth;
        state.company.logoH = img.naturalHeight;
        renderLogoPreview();
        renderPreview();
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });

  var obrasContainer = document.getElementById('obrasContainer');

  function renderObras(){

          '</select></div>'+
          '<div class="lf lf-qty"><label>'+unitQtyLabel(l.unit)+'</label><input data-f="qty" type="number" step="0.25" min="0" placeholder="0" value="'+escapeAttr(l.qty)+'"></div>'+
          '<div class="lf lf-rate"><label>'+unitRateLabel(l.unit)+'</label><input data-f="rate" type="number" step="0.5" min="0" placeholder="0.00" value="'+escapeAttr(l.rate)+'"></div>'+

          lineasHtml +
          '<button class="btn small secondary" data-action="add-linea" data-obra="'+obra.id+'" type="button" style="margin-top:4px;">+ Añadir línea</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  function escapeAttr(v){
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  }

  function handleLineaFieldChange(e){
    var titleId = e.target.getAttribute('data-obra-title');
    if(titleId){
      var obraT = state.obras.find(function(o){ return o.id == titleId; });
      if(obraT){ obraT.title = e.target.value; renderPreview(); }
      return;
    }
    var f = e.target.getAttribute('data-f');
    if(!f) return;
    var row = e.target.closest('.linea-row');
    var obraId = row.getAttribute('data-obra');
    var lineaId = row.getAttribute('data-linea');
    var obra = state.obras.find(function(o){ return o.id == obraId; });
    if(!obra) return;
    var linea = obra.lineas.find(function(l){ return l.id == lineaId; });
    if(!linea) return;
    linea[f] = e.target.value;
    if(f === 'qty' || f === 'rate'){
      row.querySelector('.linea-total').textContent = fmt(num(linea.qty)*num(linea.rate)) + ' €';
    }
    if(f === 'unit'){
      row.querySelector('.lf-qty label').textContent = unitQtyLabel(linea.unit);
      row.querySelector('.lf-rate label').textContent = unitRateLabel(linea.unit);
    }
    renderPreview();
  }
  obrasContainer.addEventListener('input', handleLineaFieldChange);
  obrasContainer.addEventListener('change', handleLineaFieldChange);

  obrasContainer.addEventListener('click', function(e){
    var action = e.target.getAttribute('data-action');
    if(!action) return;
    if(action === 'add-linea'){
      var obraId = e.target.getAttribute('data-obra');
      var obra = state.obras.find(function(o){ return o.id == obraId; });
      obra.lineas.push(newLinea());
      renderObras(); renderPreview();
    } else if(action === 'del-linea'){
      var row = e.target.closest('.linea-row');
      var obraId2 = row.getAttribute('data-obra');
      var lineaId2 = row.getAttribute('data-linea');
      var obra2 = state.obras.find(function(o){ return o.id == obraId2; });
      if(obra2.lineas.length <= 1) return;
      obra2.lineas = obra2.lineas.filter(function(l){ return l.id != lineaId2; });
      renderObras(); renderPreview();
    } else if(action === 'del-obra'){
      var obraId3 = e.target.getAttribute('data-obra');
      if(state.obras.length <= 1) return;
      state.obras = state.obras.filter(function(o){ return o.id != obraId3; });
      renderObras(); renderPreview();
    }
  });

  document.getElementById('addObraBtn').addEventListener('click', function(){
    state.obras.push(newObra("Obra " + (state.obras.length+1)));
    renderObras(); renderPreview();
  });

  /* ---------------- render: vista previa (hoja de factura) ---------------- */
  function renderPreview(){
    var totals = calcTotals();
    var sheet = document.getElementById('invoice-sheet');

    var logoHtml = state.company.logoDataUrl
      ? '<div class="sheet-logo"><img src="'+state.company.logoDataUrl+'"></div>'
      : '<div class="sheet-logo-placeholder">Logo de empresa</div>';

    var companyHtml = '<div class="sheet-company"><b>'+ (state.company.name || 'Nombre de tu empresa') +'</b><br>'+
      (state.company.taxId ? state.company.taxId+'<br>' : '') +
      (state.company.address ? state.company.address+'<br>' : '') +
      [state.company.phone, state.company.email].filter(Boolean).join(' · ') +
      '</div>';

    var rowsHtml = '';
    state.obras.forEach(function(obra){
      rowsHtml += '<tr class="obra-title-row"><td colspan="3">'+ (obra.title || 'Obra') +'</td></tr>';
      obra.lineas.forEach(function(l){
        if(!l.desc && !num(l.qty) && !num(l.rate)) return;
        rowsHtml += '<tr><td>'+ (l.desc || '—') +'</td><td class="num">'+ fmt(num(l.qty)) +' '+unitAbbr(l.unit)+' × '+ fmt(num(l.rate)) +' €</td><td class="num">'+ fmt(num(l.qty)*num(l.rate)) +' €</td></tr>';
      });
    });
    if(!rowsHtml){
      rowsHtml = '<tr><td colspan="3" class="empty-note">Añade una obra y sus líneas para verlas aquí.</td></tr>';
    }

    var isPresupuesto = state.invoice.type === 'presupuesto';
    var clientLabel = isPresupuesto ? 'Presupuesto para' : 'Facturar a';
    var clientHtml = (state.client.name || state.client.address || state.client.taxId) ?
      '<span class="lbl">'+clientLabel+'</span><b>'+(state.client.name||'—')+'</b>'+
      (state.client.taxId ? ' · '+state.client.taxId : '') + '<br>' +
      (state.client.address || '') + (state.client.email ? ' · '+state.client.email : '')
      : '<span class="lbl">'+clientLabel+'</span><i style="color:var(--ink-soft)">Rellena los datos del cliente</i>';

    var validUntilHtml = '';
    if(isPresupuesto){
      var validUntil = addDays(state.invoice.date, state.invoice.validDays);
      validUntilHtml = '<br><b>Válido hasta</b> '+ (validUntil || '—');
    }

    var conditionsHtml = '';
    if(isPresupuesto && state.invoice.conditions){
      conditionsHtml = '<div class="sheet-conditions"><b>Condiciones</b><br>'+ state.invoice.conditions +'</div>';
    }

    sheet.innerHTML =
      '<div class="sheet-top">'+ logoHtml + companyHtml + '</div>'+
      '<div class="sheet-title-block">'+
        '<h1 class="sheet-title">'+ (isPresupuesto ? 'PRESUPUESTO' : 'FACTURA') +'</h1>'+
        '<div class="meta"><b>Nº</b> '+ (state.invoice.number || '—') +'<br><b>Fecha</b> '+ (state.invoice.date || '—') + validUntilHtml +'</div>'+
      '</div>'+
      '<div class="sheet-client">'+ clientHtml +'</div>'+
      '<table class="sheet-table"><thead><tr><th>Descripción</th><th style="text-align:right">Cantidad × Precio</th><th style="text-align:right">Importe</th></tr></thead>'+
      '<tbody>'+ rowsHtml +'</tbody></table>'+
      '<div class="sheet-totals">'+
        '<div><span>Subtotal</span><span>'+ fmt(totals.subtotal) +' €</span></div>'+
        '<div><span>Impuesto ('+ fmt(num(state.invoice.taxPercent)) +'%)</span><span>'+ fmt(totals.taxAmount) +' €</span></div>'+
        '<div class="total"><span>TOTAL</span><span>'+ fmt(totals.total) +' €</span></div>'+
      '</div>'+
      conditionsHtml +
      '<div class="sheet-footer"><span>'+ (state.company.iban ? 'Pago por transferencia · IBAN '+state.company.iban : '') +'</span><span>Gracias por su confianza.</span></div>';
  }

  /* ---------------- historial ---------------- */
  function renderHistory(list){
    var el = document.getElementById('historyList');
    if(!list || !list.length){
      el.innerHTML = '<p class="hist-empty">Aún no hay facturas guardadas.</p>';
      return;
    }
    el.innerHTML = list.map(function(item){
      return '<div class="hist-item">'+
        '<div class="hist-main" data-load="'+item.number+'"><b>'+item.number+'</b> · '+fmt(item.total)+' €<div class="hist-sub">'+ (item.client||'Sin cliente') +' · '+ item.date +'</div></div>'+
        '<button class="linea-remove" data-del="'+item.number+'" title="Eliminar">×</button>'+
      '</div>';
    }).join('');
  }

  document.getElementById('historyList').addEventListener('click', function(e){
    var loadNum = e.target.closest('[data-load]');
    var delNum = e.target.getAttribute('data-del');
    if(delNum){
      deleteInvoiceSnapshot(delNum);
      getIndex().then(function(idx){
        idx = idx.filter(function(i){ return i.number !== delNum; });
        saveIndex(idx); renderHistory(idx);
      });
      return;
    }
    if(loadNum){
      var number = loadNum.getAttribute('data-load');
      loadInvoiceSnapshot(number).then(function(snap){
        if(!snap) return;
        state.client = snap.client;
        state.invoice = snap.invoice;
        // Compatibilidad con facturas guardadas antes de añadir la unidad (horas/m²)
        state.obras = (snap.obras || []).map(function(o){
          o.lineas = (o.lineas || []).map(function(l){
            if(l.qty === undefined){
              l.qty = l.hours !== undefined ? l.hours : "";
              l.unit = l.unit || "horas";
              delete l.hours;
            }
            return l;
          });
          return o;
        });
        uidCounter = (snap.uidCounter || uidCounter) + 1;
        fillStaticInputs(); renderObras(); renderPreview();
      });
    }
  });

  /* ---------------- nueva factura ---------------- */
  document.getElementById('newInvoiceBtn').addEventListener('click', function(){
    var keepType = state.invoice.type;
    var keepTax = state.invoice.taxPercent;
    var keepValidDays = state.invoice.validDays;
    var keepConditions = state.invoice.conditions;
    getCounter().then(function(counter){
      state.client = { name:"", taxId:"", address:"", email:"" };
      state.invoice = { type: keepType, number: suggestNextNumber(counter), date: new Date().toISOString().slice(0,10), taxPercent: keepTax || 21, validDays: keepValidDays || 30, conditions: keepConditions || "" };
      state.obras = [ newObra("Obra 1") ];
      fillStaticInputs(); renderObras(); renderPreview();
    });
  });

  /* ---------------- generar PDF ---------------- */
  document.getElementById('generateBtn').addEventListener('click', function(){
    var totals = calcTotals();
    var doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    var pageWidth = doc.internal.pageSize.getWidth();
    var marginX = 15;
    var cursorY = 18;

    // Logo
    if(state.company.logoDataUrl){
      try{
        var maxW = 40, maxH = 22;
        var ratio = Math.min(maxW/state.company.logoW, maxH/state.company.logoH);
        var w = state.company.logoW * ratio, h = state.company.logoH * ratio;
        var format = state.company.logoDataUrl.indexOf('image/png') !== -1 ? 'PNG' : 'JPEG';
        doc.addImage(state.company.logoDataUrl, format, marginX, cursorY, w, h);
      }catch(err){}
    }

    // Datos empresa (derecha)
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(state.company.name || 'Tu empresa', pageWidth - marginX, cursorY + 4, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,105);
    var compLines = [state.company.taxId, state.company.address, [state.company.phone,state.company.email].filter(Boolean).join(' · ')].filter(Boolean);
    compLines.forEach(function(line, i){ doc.text(line, pageWidth - marginX, cursorY + 9 + i*4.5, {align:'right'}); });

    cursorY = 46;
    doc.setDrawColor(27,43,53); doc.setLineWidth(0.8);
    doc.line(marginX, cursorY, pageWidth - marginX, cursorY);
    cursorY += 10;

    // Título + meta
    var isPresupuestoPdf = state.invoice.type === 'presupuesto';
    doc.setTextColor(27,43,53); doc.setFont('helvetica','bold'); doc.setFontSize(22);
    doc.text(isPresupuestoPdf ? 'PRESUPUESTO' : 'FACTURA', marginX, cursorY);
    doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(90,100,105);
    doc.text('Nº '+(state.invoice.number||'—'), pageWidth - marginX, cursorY - 5, {align:'right'});
    doc.text('Fecha '+(state.invoice.date||'—'), pageWidth - marginX, cursorY, {align:'right'});
    if(isPresupuestoPdf){
      doc.text('Válido hasta '+(addDays(state.invoice.date, state.invoice.validDays)||'—'), pageWidth - marginX, cursorY + 5, {align:'right'});
    }
    cursorY += 10;

    // Cliente
    doc.setFillColor(245,243,236);
    doc.rect(marginX, cursorY, pageWidth - marginX*2, 18, 'F');
    doc.setDrawColor(226,162,59); doc.setLineWidth(1.2);
    doc.line(marginX, cursorY, marginX, cursorY+18);
    doc.setFontSize(8); doc.setTextColor(90,100,105);
    doc.text(isPresupuestoPdf ? 'PRESUPUESTO PARA' : 'FACTURAR A', marginX + 4, cursorY + 6);
    doc.setFontSize(10.5); doc.setTextColor(27,43,53); doc.setFont('helvetica','bold');
    doc.text(state.client.name || '—', marginX + 4, cursorY + 11.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,105);
    var clientLine2 = [state.client.taxId, state.client.address].filter(Boolean).join(' · ');
    doc.text(clientLine2 || '', marginX + 4, cursorY + 16);
    cursorY += 26;

    // Tabla
    var body = [];
    state.obras.forEach(function(obra){
      body.push([{ content: obra.title || 'Obra', colSpan:3, styles:{ fillColor:[245,243,236], fontStyle:'bold', textColor:[27,43,53] } }]);
      obra.lineas.forEach(function(l){
        if(!l.desc && !num(l.qty) && !num(l.rate)) return;
        body.push([ l.desc || '—', fmt(num(l.qty))+' '+unitAbbr(l.unit)+' × '+fmt(num(l.rate))+' €', fmt(num(l.qty)*num(l.rate))+' €' ]);
      });
    });
    if(body.length === 0){ body.push(['Sin conceptos','','']); }

    doc.autoTable({
      startY: cursorY,
      head: [['Descripción','Cantidad × Precio','Importe']],
      body: body,
      theme: 'plain',
      margin:{left:marginX, right:marginX},
      styles:{ fontSize:9.5, cellPadding:2.2, textColor:[27,43,53] },
      headStyles:{ textColor:[91,107,115], fontStyle:'bold', fontSize:8, lineWidth:{bottom:0.6}, lineColor:[27,43,53] },
      columnStyles:{ 1:{halign:'right', cellWidth:55}, 2:{halign:'right', cellWidth:35} },
      didParseCell: function(data){
        if(data.row.raw.length === 1){ data.cell.styles.halign = 'left'; }
      }
    });

    var finalY = doc.lastAutoTable.finalY + 8;
    var totalsX = pageWidth - marginX;
    doc.setFontSize(10); doc.setTextColor(90,100,105); doc.setFont('helvetica','normal');
    doc.text('Subtotal', totalsX - 55, finalY);
    doc.text(fmt(totals.subtotal)+' €', totalsX, finalY, {align:'right'});
    doc.text('Impuesto ('+fmt(num(state.invoice.taxPercent))+'%)', totalsX - 55, finalY + 6);
    doc.text(fmt(totals.taxAmount)+' €', totalsX, finalY + 6, {align:'right'});
    doc.setDrawColor(27,43,53); doc.setLineWidth(0.6);
    doc.line(totalsX - 55, finalY + 10, totalsX, finalY + 10);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(27,43,53);
    doc.text('TOTAL', totalsX - 55, finalY + 17);
    doc.text(fmt(totals.total)+' €', totalsX, finalY + 17, {align:'right'});

    // Condiciones (solo presupuestos)
    if(isPresupuestoPdf && state.invoice.conditions){
      var condY = finalY + 28;
      doc.setFillColor(245,243,236);
      doc.setDrawColor(52,92,116); doc.setLineWidth(1.2);
      var condLines = doc.splitTextToSize(state.invoice.conditions, pageWidth - marginX*2 - 10);
      var condBoxH = 8 + condLines.length * 4.2;
      doc.rect(marginX, condY, pageWidth - marginX*2, condBoxH, 'F');
      doc.line(marginX, condY, marginX, condY + condBoxH);
      doc.setFontSize(8); doc.setTextColor(90,100,105); doc.setFont('helvetica','bold');
      doc.text('CONDICIONES', marginX + 4, condY + 5);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(27,43,53);
      doc.text(condLines, marginX + 4, condY + 10);
    }

    // Footer
    var pageHeight = doc.internal.pageSize.getHeight();
    doc.setDrawColor(215,211,199); doc.setLineWidth(0.3);
    doc.line(marginX, pageHeight - 20, pageWidth - marginX, pageHeight - 20);
    doc.setFontSize(8); doc.setTextColor(90,100,105); doc.setFont('helvetica','normal');
    if(state.company.iban){ doc.text('Pago por transferencia · IBAN ' + state.company.iban, marginX, pageHeight - 14); }
    doc.text('Gracias por su confianza.', pageWidth - marginX, pageHeight - 14, {align:'right'});

    var filePrefix = isPresupuestoPdf ? 'Presupuesto_' : 'Factura_';
    var filename = filePrefix + (state.invoice.number || 'sin-numero') + (state.client.name ? '_' + state.client.name.replace(/[^a-z0-9]+/gi,'-') : '') + '.pdf';
    doc.save(filename);

    saveToHistory();
  });

  document.getElementById('saveInvoiceBtn').addEventListener('click', function(){
    var btn = this; var old = btn.textContent;
    saveToHistory().then(function(){
      btn.textContent = 'Guardado ✓';
      setTimeout(function(){ btn.textContent = old; }, 1400);
    });
  });

  /* ---------------- tabs móvil ---------------- */
  var tabForm = document.getElementById('tabForm');
  var tabPreview = document.getElementById('tabPreview');
  var colForm = document.getElementById('colForm');
  var colPreview = document.getElementById('colPreview');
  tabForm.addEventListener('click', function(){
    tabForm.classList.add('active'); tabPreview.classList.remove('active');
    colForm.classList.remove('panel-hidden'); colPreview.classList.add('panel-hidden');
  });
  tabPreview.addEventListener('click', function(){
    tabPreview.classList.add('active'); tabForm.classList.remove('active');
    colPreview.classList.remove('panel-hidden'); colForm.classList.add('panel-hidden');
  });
  function syncPanelsForWidth(){
    if(window.innerWidth > 920){
      colForm.classList.remove('panel-hidden');
      colPreview.classList.remove('panel-hidden');
    } else if(!colPreview.classList.contains('panel-hidden') && !colForm.classList.contains('panel-hidden')){
      colPreview.classList.add('panel-hidden');
    }
  }
  window.addEventListener('resize', syncPanelsForWidth);

  /* ---------------- init ---------------- */
  function init(){
    Promise.all([ loadCompanyProfile(), getCounter(), getIndex() ]).then(function(res){
      var company = res[0], counter = res[1], idx = res[2];
      if(company){ state.company = Object.assign(state.company, company); }
      state.invoice.number = suggestNextNumber(counter);
      fillStaticInputs();
      renderObras();
      renderPreview();
      renderHistory(idx);
    });
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
